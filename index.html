<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信公众号安全漏洞文章归档</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --border: #30363d;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #a371f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: 600;
        }
        
        .logo-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* Search */
        .search-box {
            flex: 1;
            max-width: 500px;
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-input:focus {
            border-color: var(--accent);
        }
        
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }
        
        .search-results.active {
            display: block;
        }
        
        .search-result-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        
        .search-result-item:hover {
            background: var(--bg-tertiary);
        }
        
        .search-result-item:last-child {
            border-bottom: none;
        }
        
        .search-result-title {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .search-result-path {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* Stats */
        .stats {
            display: flex;
            gap: 16px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* Main Layout */
        .main {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 73px);
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        
        .month-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .month-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .month-item:hover {
            background: var(--bg-tertiary);
        }
        
        .month-item.active {
            background: var(--bg-tertiary);
            color: var(--accent);
        }
        
        .month-count {
            font-size: 12px;
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--text-secondary);
        }
        
        /* Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* Article List */
        .article-list {
            padding: 20px;
        }
        
        .article-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .article-list-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .article-count {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        
        .article-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .article-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .article-card-title {
            font-weight: 500;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
        }
        
        .article-tag {
            display: inline-block;
            padding: 2px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 11px;
            margin-top: 8px;
        }
        
        .article-tag.cve {
            background: rgba(248, 81, 73, 0.15);
            color: var(--danger);
        }
        
        .article-tag.0day {
            background: rgba(210, 153, 34, 0.15);
            color: var(--warning);
        }
        
        /* Article View */
        .article-view {
            flex: 1;
            display: none;
        }
        
        .article-view.active {
            display: flex;
            flex-direction: column;
        }
        
        .article-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        
        .article-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            cursor: pointer;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .article-back:hover {
            text-decoration: underline;
        }
        
        .article-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .article-meta {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .article-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .article-content {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* Markdown Styles */
        .article-content h1, .article-content h2, .article-content h3 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .article-content h1 { font-size: 28px; }
        .article-content h2 { font-size: 22px; }
        .article-content h3 { font-size: 18px; }
        
        .article-content p {
            margin-bottom: 16px;
        }
        
        .article-content pre {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 16px 0;
        }
        
        .article-content code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 14px;
        }
        
        .article-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 16px 0;
        }
        
        .article-content a {
            color: var(--accent);
        }
        
        .article-content ul, .article-content ol {
            margin: 16px 0;
            padding-left: 24px;
        }
        
        .article-content li {
            margin-bottom: 8px;
        }
        
        .article-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-secondary);
        }
        
        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        
        .article-content th, .article-content td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }
        
        .article-content th {
            background: var(--bg-tertiary);
        }
        
        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        /* Footer */
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }
        
        .footer a {
            color: var(--accent);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .header-content {
                flex-wrap: wrap;
            }
            
            .stats {
                display: none;
            }
            
            .search-box {
                order: 3;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo" onclick="goHome(); return false;">
                <div class="logo-icon">🛡️</div>
                <div>
                    <div class="logo-text">WXVL</div>
                    <div class="logo-desc">微信公众号安全漏洞文章归档</div>
                </div>
            </a>
            
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="搜索漏洞文章..." id="searchInput" oninput="handleSearch(this.value)">
                <div class="search-results" id="searchResults"></div>
            </div>
            
            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalArticles">-</div>
                    <div class="stat-label">文章总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalMonths">-</div>
                    <div class="stat-label">月份归档</div>
                </div>
            </div>
        </div>
    </header>
    
    <main class="main">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">归档月份</div>
                <div class="month-list" id="monthList">
                    <div class="loading"><div class="spinner"></div>加载中...</div>
                </div>
            </div>
        </aside>
        
        <div class="content">
            <div class="article-list" id="articleList">
                <div class="article-list-header">
                    <div class="article-list-title" id="currentMonth">全部文章</div>
                    <div class="article-count" id="articleCount"></div>
                </div>
                <div class="article-grid" id="articleGrid">
                    <div class="loading"><div class="spinner"></div>加载中...</div>
                </div>
            </div>
            
            <div class="article-view" id="articleView">
                <div class="article-header">
                    <div class="article-back" onclick="goBack()">← 返回列表</div>
                    <h1 class="article-title" id="articleTitle"></h1>
                    <div class="article-meta" id="articleMeta"></div>
                </div>
                <div class="article-body">
                    <div class="article-content" id="articleContent">
                        <div class="loading"><div class="spinner"></div>加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <p>数据来源: <a href="https://github.com/chainreactors/picker" target="_blank">picker</a> | 
           基于 <a href="https://github.com/20142995/wxvl" target="_blank">wxvl</a> 扩展 | 
           部署于 <a href="https://vercel.com" target="_blank">Vercel</a></p>
    </footer>
    
    <script>
        // API Base URL (Vercel部署后自动使用相对路径)
        const API_BASE = '/api';
        
        // State
        let currentMonth = null;
        let allArticles = [];
        let searchTimeout = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadMonths();
            loadAllArticles();
        });
        
        // Load Statistics
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}?action=stats`);
                const data = await res.json();
                if (data.code === 200) {
                    document.getElementById('totalArticles').textContent = data.data.totalArticles;
                    document.getElementById('totalMonths').textContent = data.data.totalMonths;
                }
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }
        
        // Load Months
        async function loadMonths() {
            try {
                const res = await fetch(`${API_BASE}?action=months`);
                const data = await res.json();
                if (data.code === 200) {
                    renderMonths(data.data);
                }
            } catch (e) {
                console.error('Failed to load months:', e);
                document.getElementById('monthList').innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }
        
        // Render Months
        function renderMonths(months) {
            const container = document.getElementById('monthList');
            container.innerHTML = months.map(m => `
                <div class="month-item ${currentMonth === m.name ? 'active' : ''}" onclick="selectMonth('${m.name}')">
                    <span>${formatMonth(m.name)}</span>
                    <span class="month-count">${m.count}</span>
                </div>
            `).join('');
        }
        
        // Format Month Display
        function formatMonth(month) {
            const [year, mon] = month.split('-');
            return `${year}年${mon}月`;
        }
        
        // Select Month
        async function selectMonth(month) {
            currentMonth = month;
            document.querySelectorAll('.month-item').forEach(el => {
                el.classList.toggle('active', el.textContent.includes(formatMonth(month)));
            });
            document.getElementById('currentMonth').textContent = formatMonth(month);
            
            // Load articles for this month
            await loadMonthArticles(month);
            
            // Show article list
            document.getElementById('articleList').style.display = 'block';
            document.getElementById('articleView').classList.remove('active');
        }
        
        // Load Month Articles
        async function loadMonthArticles(month) {
            const grid = document.getElementById('articleGrid');
            grid.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
            
            try {
                const res = await fetch(`${API_BASE}?action=list&month=${month}`);
                const data = await res.json();
                if (data.code === 200) {
                    renderArticles(data.data);
                    document.getElementById('articleCount').textContent = `共 ${data.data.length} 篇`;
                }
            } catch (e) {
                console.error('Failed to load articles:', e);
                grid.innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }
        
        // Load All Articles
        async function loadAllArticles() {
            try {
                const res = await fetch(`${API_BASE}?action=list`);
                const data = await res.json();
                if (data.code === 200) {
                    allArticles = data.data;
                    renderArticles(allArticles);
                    document.getElementById('articleCount').textContent = `共 ${allArticles.length} 篇`;
                }
            } catch (e) {
                console.error('Failed to load all articles:', e);
            }
        }
        
        // Render Articles
        function renderArticles(articles) {
            const grid = document.getElementById('articleGrid');
            
            if (articles.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无文章</p></div>';
                return;
            }
            
            grid.innerHTML = articles.map(article => {
                const tags = extractTags(article.name);
                return `
                    <div class="article-card" onclick="viewArticle('${article.path}')">
                        <div class="article-card-title">${escapeHtml(article.name.replace('.md', ''))}</div>
                        <div class="article-card-meta">
                            <span>${article.month || ''}</span>
                            <span>${formatSize(article.size)}</span>
                        </div>
                        ${tags.map(t => `<span class="article-tag ${t.class}">${t.text}</span>`).join('')}
                    </div>
                `;
            }).join('');
        }
        
        // Extract Tags from Title
        function extractTags(title) {
            const tags = [];
            if (/CVE-\d+/i.test(title)) tags.push({ text: 'CVE', class: 'cve' });
            if (/0day/i.test(title)) tags.push({ text: '0day', class: '0day' });
            if (/CNVD/i.test(title)) tags.push({ text: 'CNVD', class: 'cve' });
            return tags;
        }
        
        // View Article
        async function viewArticle(path) {
            document.getElementById('articleList').style.display = 'none';
            document.getElementById('articleView').classList.add('active');
            document.getElementById('articleContent').innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
            
            try {
                const res = await fetch(`${API_BASE}?action=article&path=${encodeURIComponent(path)}`);
                const data = await res.json();
                if (data.code === 200) {
                    document.getElementById('articleTitle').textContent = data.data.title;
                    document.getElementById('articleMeta').textContent = `${data.data.month} · ${formatSize(data.data.size)}`;
                    document.getElementById('articleContent').innerHTML = data.data.html;
                    // Apply syntax highlighting
                    document.querySelectorAll('#articleContent pre code').forEach(block => {
                        hljs.highlightElement(block);
                    });
                }
            } catch (e) {
                console.error('Failed to load article:', e);
                document.getElementById('articleContent').innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }
        
        // Search
        function handleSearch(query) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (query.length < 2) {
                    document.getElementById('searchResults').classList.remove('active');
                    return;
                }
                performSearch(query);
            }, 300);
        }
        
        async function performSearch(query) {
            try {
                const res = await fetch(`${API_BASE}?action=search&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.code === 200) {
                    renderSearchResults(data.data);
                }
            } catch (e) {
                console.error('Search failed:', e);
            }
        }
        
        function renderSearchResults(results) {
            const container = document.getElementById('searchResults');
            
            if (results.length === 0) {
                container.innerHTML = '<div class="search-result-item"><div class="search-result-title">未找到结果</div></div>';
            } else {
                container.innerHTML = results.slice(0, 10).map(r => `
                    <div class="search-result-item" onclick="viewArticle('${r.path}')">
                        <div class="search-result-title">${escapeHtml(r.title)}</div>
                        <div class="search-result-path">${r.month}</div>
                    </div>
                `).join('');
            }
            
            container.classList.add('active');
        }
        
        // Go Back
        function goBack() {
            document.getElementById('articleView').classList.remove('active');
            document.getElementById('articleList').style.display = 'block';
        }
        
        // Go Home
        function goHome() {
            currentMonth = null;
            document.querySelectorAll('.month-item').forEach(el => el.classList.remove('active'));
            document.getElementById('currentMonth').textContent = '全部文章';
            document.getElementById('articleList').style.display = 'block';
            document.getElementById('articleView').classList.remove('active');
            loadAllArticles();
        }
        
        // Utilities
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                document.getElementById('searchResults').classList.remove('active');
            }
        });
    </script>
</body>
</html>
